<!-- Initialize Supabase and Modules -->
<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  // --- SUPABASE CONFIGURATION ---
  // Replace these with your actual Supabase URL and Anon Key
  const SUPABASE_URL = 'https://umgfogfuljroiqvkyugd.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_b4YGCNNdgl44Ue95MTr2Ew_Tc537pzV'; 
  
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  window.supabaseClient = supabase; // Make it globally accessible for the rest of the script

  // ================= AUTH LOGIC (auth.js) =================
  async function signUp({ email, password, username, displayName, height, weight, age, gender }) {
    const { data, error } = await supabase.auth.signUp({
      email,
      password,
      options: {
        data: {
          username,
          display_name: displayName || username,
          height: height ? String(height) : '',
          weight: weight ? String(weight) : '',
          age: age ? String(age) : '',
          gender: gender || 'none',
          avatar_emoji: '🙂'
        },
        emailRedirectTo: `${window.location.origin}`
      }
    });
    if (error) throw error;
    return data;
  }
  window.authSignUp = signUp;

  async function signIn(email, password) {
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) throw error;
    return data;
  }
  window.authSignIn = signIn;

  async function signOut() {
    await supabase.auth.signOut();
  }
  window.authSignOut = signOut;

  async function getCurrentSession() {
    const { data: { session } } = await supabase.auth.getSession();
    return session;
  }
  window.getCurrentSession = getCurrentSession;

  async function getMyProfile() {
    const session = await getCurrentSession();
    if (!session) return null;
    const { data, error } = await supabase
      .from('profiles')
      .select('*')
      .eq('id', session.user.id)
      .single();
    if (error) { console.error("Profil alınamadı:", error); return null; }
    return data;
  }
  window.getMyProfile = getMyProfile;

  async function updateMyProfile(fields) {
    const session = await getCurrentSession();
    if (!session) throw new Error('Oturum yok');
    const { data, error } = await supabase
      .from('profiles')
      .update(fields)
      .eq('id', session.user.id)
      .select()
      .single();
    if (error) throw error;
    return data;
  }
  window.updateMyProfile = updateMyProfile;

  // Boot the app after defining modules
  if (typeof window.startApp === 'function') {
      window.startApp();
  }
</script>

<script>
const root = document.getElementById('root');
const S = { user:null, profile:null, view:'dashboard', date: todayStr(), chatWith:null, cache:{} };
let authMode = 'login'; // login or signup

function todayStr(d){ const x=d?new Date(d):new Date(); return x.toISOString().slice(0,10); }
function fmtDateLabel(ds){
  const d=new Date(ds+'T00:00:00');
  const t=new Date(todayStr()+'T00:00:00');
  const diff=Math.round((t-d)/86400000);
  const days=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
  if(diff===0) return 'Bugün';
  if(diff===1) return 'Dün';
  return days[d.getDay()]+' · '+d.getDate()+'/'+(d.getMonth()+1);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ================= BOOT & AUTH (authScreen.js) =================
// Called from the module script above once it's loaded
window.startApp = async function() {
    try {
        const session = await window.getCurrentSession();
        if (session) {
            S.user = session.user;
            S.profile = await window.getMyProfile();
            render();
        } else {
            renderAuthScreen();
        }
    } catch (e) {
        console.error("Boot error:", e);
        renderAuthScreen();
    }
}

function renderAuthScreen() {
  root.innerHTML = `
    <div class="login-wrap">
      <h1 style="text-align:center; color:var(--accent);">Ritim</h1>
      <p class="muted" style="text-align:center; margin-bottom:24px;">Günlük Takip & Sosyal Ağ</p>
      
      <div style="display:flex; gap:10px; margin-bottom:16px;">
        <button class="${authMode==='login'?'btn-primary':'btn-ghost'}" style="flex:1;" onclick="setAuthMode('login')">Giriş Yap</button>
        <button class="${authMode==='signup'?'btn-primary':'btn-ghost'}" style="flex:1;" onclick="setAuthMode('signup')">Kayıt Ol</button>
      </div>

      <div class="card" id="auth-form-container">
        ${authMode === 'login' ? loginFormHtml() : signupFormHtml()}
      </div>
    </div>
  `;
}

function setAuthMode(m) {
    authMode = m;
    renderAuthScreen();
}

function loginFormHtml() {
  return `
    <div class="field"><label>E-posta</label><input id="li-email" type="email" placeholder="ornek@mail.com"></div>
    <div class="field"><label>Şifre</label><input id="li-pass" type="password" placeholder="••••••••"></div>
    <button class="btn-primary" style="width:100%; margin-top:10px;" onclick="handleLogin()">Giriş Yap</button>
  `;
}

function signupFormHtml() {
  return `
    <div class="field"><label>E-posta</label><input id="su-email" type="email" placeholder="ornek@mail.com"></div>
    <div class="field"><label>Şifre</label><input id="su-pass" type="password" placeholder="En az 6 karakter"></div>
    <div class="field"><label>Kullanıcı adı</label><input id="su-username" placeholder="en az 4 karakter"></div>
    <div class="field"><label>Görünen ad</label><input id="su-display" placeholder="Adın Soyadın"></div>
    <div class="grid2">
        <div class="field"><label>Boy (cm)</label><input id="su-height" type="number" placeholder="175"></div>
        <div class="field"><label>Kilo (kg)</label><input id="su-weight" type="number" placeholder="70"></div>
    </div>
    <div class="grid2">
        <div class="field"><label>Yaş</label><input id="su-age" type="number" placeholder="25"></div>
        <div class="field"><label>Cinsiyet</label>
            <select id="su-gender">
            <option value="none" selected>Belirtme</option>
            <option value="erkek">Erkek</option>
            <option value="kadin">Kadın</option>
            </select>
        </div>
    </div>
    <button class="btn-primary" style="width:100%; margin-top:10px;" onclick="handleSignup()">Kayıt Ol</button>
  `;
}

async function handleLogin() {
  const email = document.getElementById('li-email').value.trim();
  const password = document.getElementById('li-pass').value;
  try {
    const { session } = await window.authSignIn(email, password);
    S.user = session.user;
    S.profile = await window.getMyProfile();
    render();
  } catch (e) {
    if (e.message.includes('Email not confirmed')) {
      alert('Önce e-postana gelen onay linkine tıklaman gerekiyor.');
    } else {
      alert('Giriş başarısız: ' + e.message);
    }
  }
}

async function handleSignup() {
  const username = document.getElementById('su-username').value.trim();
  if (username.length < 4) { alert('Kullanıcı adı en az 4 karakter olmalı.'); return; }
  
  const fields = {
    email: document.getElementById('su-email').value.trim(),
    password: document.getElementById('su-pass').value,
    username,
    displayName: document.getElementById('su-display').value.trim(),
    height: document.getElementById('su-height').value,
    weight: document.getElementById('su-weight').value,
    age: document.getElementById('su-age').value,
    gender: document.getElementById('su-gender').value
  };

  try {
    await window.authSignUp(fields);
    alert('Kayıt tamam! Lütfen e-postanıza gönderdiğimiz onay linkine tıklayın, ardından Giriş Yapabilirsiniz.');
    setAuthMode('login');
  } catch (e) {
    alert('Kayıt başarısız: ' + e.message);
  }
}

async function doLogout(){
  await window.authSignOut();
  S.user = null;
  S.profile = null;
  renderAuthScreen();
}

  async function loadUserProfile() {
    if (!S.user) return;
    try {
      const { data, error } = await sb
        .from('profiles')
        .select('*')
        .eq('id', S.user.id)
        .single();
        
      if (data) {
        S.profile = data;
      } else {
        console.warn("Profil bulunamadı:", error);
      }
    } catch (err) {
      console.error("Profil yüklenirken hata:", err);
    }
  }

  function renderAuthLanding() {
    const root = document.getElementById('app');
    root.innerHTML = `
      <div class="p-6 flex flex-col justify-center min-h-screen">
        <h1 class="text-4xl font-serif font-bold mb-2 text-accent">Ritim</h1>
        <p class="text-[#8FA39A] text-sm mb-6">Günlük düzenini takip et, AI asistanlarla kalorini hesapla, arkadaşlarınla bağlan.</p>
        <div class="bg-[#16241F] border border-[#2A3D35] p-5 rounded-2xl space-y-3">
          <button onclick="renderLoginScreen()" class="w-full py-3 bg-accent text-[#1A0E09] font-bold rounded-xl shadow-lg">Oturum Aç</button>
          <button onclick="renderRegisterScreen()" class="w-full py-3 bg-[#1E332B] text-[#EDEAE0] border border-[#2A3D35] font-bold rounded-xl">Yeni Hesap Oluştur</button>
        </div>
      </div>
    `;
  }

  function renderLoginScreen() {
    const root = document.getElementById('app');
    root.innerHTML = `
      <div class="p-6 flex flex-col justify-center min-h-screen">
        <h1 class="text-3xl font-serif font-bold mb-2">Oturum Aç</h1>
        <p class="text-[#8FA39A] text-sm mb-6">E-posta ve şifrenle giriş yap.</p>
        <div class="bg-[#16241F] border border-[#2A3D35] p-5 rounded-2xl space-y-4">
          <div>
            <label class="block text-xs text-[#8FA39A] mb-1">E-posta</label>
            <input id="lg-email" type="email" class="w-full bg-[#1E332B] border border-[#2A3D35] rounded-xl p-3 text-sm focus:outline-none focus:border-accent" placeholder="ornek@mail.com">
          </div>
          <div>
            <label class="block text-xs text-[#8FA39A] mb-1">Şifre</label>
            <input id="lg-pw" type="password" class="w-full bg-[#1E332B] border border-[#2A3D35] rounded-xl p-3 text-sm focus:outline-none focus:border-accent" placeholder="••••••••">
          </div>
          <button onclick="doLogin()" class="w-full py-3 bg-accent text-[#1A0E09] font-bold rounded-xl shadow-lg mt-2">Giriş Yap</button>
          <button onclick="renderAuthLanding()" class="w-full py-2 bg-[#1E332B] text-xs rounded-xl text-[#8FA39A] border border-[#2A3D35]">‹ Geri</button>
        </div>
      </div>
    `;
  }

  async function doLogin() {
    const email = document.getElementById('lg-email').value.trim();
    const password = document.getElementById('lg-pw').value;
    if (!email || !password) {
      alert("Lütfen tüm alanları doldurun.");
      return;
    }

    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      alert("Giriş başarısız: " + error.message);
      return;
    }

    S.user = data.user;
    await loadUserProfile();
    renderMainApp();
  }

  function renderRegisterScreen() {
    const root = document.getElementById('app');
    root.innerHTML = `
      <div class="p-6 flex flex-col justify-center min-h-screen">
        <h1 class="text-3xl font-serif font-bold mb-2">Kayıt Ol</h1>
        <p class="text-[#8FA39A] text-sm mb-6">Kullanıcı adı ve görünen adınla profilini oluştur.</p>
        <div class="bg-[#16241F] border border-[#2A3D35] p-5 rounded-2xl space-y-3">
          <div>
            <label class="block text-xs text-[#8FA39A] mb-1">Kullanıcı Adı (en az 4 karakter)</label>
            <input id="reg-username" class="w-full bg-[#1E332B] border border-[#2A3D35] rounded-xl p-3 text-sm focus:outline-none focus:border-accent" placeholder="ornek_kisi">
          </div>
          <div>
            <label class="block text-xs text-[#8FA39A] mb-1">Görünen Ad</label>
            <input id="reg-display" class="w-full bg-[#1E332B] border border-[#2A3D35] rounded-xl p-3 text-sm focus:outline-none focus:border-accent" placeholder="Adın Soyadın">
          </div>
          <div>
            <label class="block text-xs text-[#8FA39A] mb-1">E-posta</label>
            <input id="reg-email" type="email" class="w-full bg-[#1E332B] border border-[#2A3D35] rounded-xl p-3 text-sm focus:outline-none focus:border-accent" placeholder="ornek@mail.com">
          </div>
          <div>
            <label class="block text-xs text-[#8FA39A] mb-1">Şifre (Min 6 karakter)</label>
            <input id="reg-pw" type="password" class="w-full bg-[#1E332B] border border-[#2A3D35] rounded-xl p-3 text-sm focus:outline-none focus:border-accent" placeholder="••••••••">
          </div>
          <button onclick="doRegister()" class="w-full py-3 bg-accent text-[#1A0E09] font-bold rounded-xl shadow-lg mt-2">Kayıt Ol</button>
          <button onclick="renderAuthLanding()" class="w-full py-2 bg-[#1E332B] text-xs rounded-xl text-[#8FA39A] border border-[#2A3D35]">‹ Geri</button>
        </div>
      </div>
    `;
  }

  async function doRegister() {
    const username = document.getElementById('reg-username').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
    const displayName = document.getElementById('reg-display').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-pw').value;

    if (!username || username.length < 4 || !displayName || !email || !password) {
      alert("Lütfen tüm alanları eksiksiz doldurun (Kullanıcı adı min 4 karakter).");
      return;
    }

    const { data, error } = await sb.auth.signUp({ email, password });
    if (error) {
      alert("Kayıt hatası: " + error.message);
      return;
    }

    if (data.user) {
      const { error: profileErr } = await sb.from('profiles').insert([
        { id: data.user.id, username: username, display_name: displayName, photo: null }
      ]);

      if (profileErr) {
        console.error("Profil kaydedilemedi:", profileErr.message);
        alert("Kayıt olundu ancak profil kaydedilirken hata oluştu: " + profileErr.message);
      } else {
        alert("Kayıt başarılı! Giriş yapabilirsiniz.");
        renderLoginScreen();
      }
    }
  }

  function renderMainApp() {
    const root = document.getElementById('app');
    const displayName = S.profile ? S.profile.display_name : (S.user ? S.user.email : 'Kullanıcı');
    
    root.innerHTML = `
      <div class="px-5 pt-6 pb-3 flex justify-between items-center bg-[#0F1A16] sticky top-0 z-30">
        <div>
          <h2 class="text-2xl font-serif font-bold">Ritim, ${displayName}</h2>
          <p class="text-xs text-[#8FA39A]">Günlük Düzen & Takip</p>
        </div>
        <button onclick="doLogout()" class="text-xs bg-[#1E332B] px-3 py-1.5 rounded-lg border border-[#2A3D35] text-[#8FA39A]">Çıkış</button>
      </div>

      <div id="main-content" class="flex-1 px-4 pb-28 overflow-y-auto"></div>

      <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] bg-[#16241F] border-t border-[#2A3D35] flex justify-around p-2 z-40">
        ${navBtn('dashboard', '📋', 'Panel')}
        ${navBtn('profile', '⚙️', 'Profil')}
      </nav>
    `;
    renderViewContent();
  }

  function navBtn(id, icon, label) {
    const active = S.view === id;
    return `<button onclick="switchView('${id}')" class="flex flex-col items-center p-2 rounded-xl text-xs font-medium ${active ? 'text-accent' : 'text-[#8FA39A]'}">
      <span class="text-lg">${icon}</span>${label}
    </button>`;
  }

  function switchView(v) {
    S.view = v;
    renderMainApp();
  }

  async function doLogout() {
    await sb.auth.signOut();
    S.user = null;
    S.profile = null;
    renderAuthLanding();
  }

  function renderViewContent() {
    const c = document.getElementById('main-content');
    if (!c) return;
    if (S.view === 'dashboard') renderDashboardView(c);
    else if (S.view === 'profile') renderProfileView(c);
  }

  function renderDashboardView(c) {
    const displayName = S.profile ? S.profile.display_name : 'Kullanıcı';
    const username = S.profile ? S.profile.username : '—';
    c.innerHTML = `
      <div class="bg-[#16241F] border border-[#2A3D35] rounded-2xl p-5 mb-4">
        <h3 class="font-serif font-bold text-base mb-2">Hoş Geldin, ${displayName}!</h3>
        <p class="text-xs text-[#8FA39A]">Kullanıcı Adı: @${username}</p>
      </div>
      <div class="bg-[#16241F] border border-[#2A3D35] rounded-2xl p-4 text-center">
        <p class="text-xs text-[#8FA39A]">Ritim günlük takip sisteminiz aktif ve çalışıyor.</p>
      </div>
    `;
  }

  function renderProfileView(c) {
    const p = S.profile || {};
    c.innerHTML = `
      <div class="bg-[#16241F] border border-[#2A3D35] rounded-2xl p-5 text-center mb-4">

        <p class="text-xs text-[#8FA39A]">@${p.username || 'kullanici'}</p>
        <p class="text-[11px] text-[#8FA39A] mt-1">${S.user ? S.user.email : ''}</p>
      </div>
    `;
  }

  window.addEventListener('DOMContentLoaded', () => {
    boot();
  });
</script>
