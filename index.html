  .login-wrap{display:flex;flex-direction:column;justify-content:center;min-height:100vh;padding:30px;}
  .login-wrap h1{font-size:30px;margin-bottom:6px;}
  .auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);padding:4px;border-radius:11px;margin-bottom:16px;}
  .auth-tabs button{background:transparent;color:var(--muted);}
  .auth-tabs button.active{background:var(--surface);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.18);}

  .chat-me{background:var(--accent);color:#1A0E09;margin-left:auto;border-bottom-right-radius:4px;}
  .chat-them{background:var(--surface-2);margin-right:auto;border-bottom-left-radius:4px;}
  .fab{position:fixed;bottom:80px;right:calc(50% - 240px + 18px);background:var(--accent);color:#1A0E09;width:50px;height:50px;border-radius:50%;

  @media(max-width:520px){.fab{right:18px;}}
  a{color:var(--accent);}
  ::-webkit-scrollbar{width:0;}
</style>

<script>
// Supabase Dashboard > Project Settings > API bölümündeki değerleri girin.
// Anon key tarayıcıda kullanılmak üzere tasarlanmıştır; güvenliği supabase.sql içindeki RLS kuralları sağlar.
const SUPABASE_URL = 'https://umgfogfuljroiqvkyugd.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_b4YGCNNdgl44Ue95MTr2Ew_Tc537pzV';
const supabaseReady = !SUPABASE_URL.startsWith('YOUR_') && !SUPABASE_ANON_KEY.startsWith('YOUR_');
const db = supabaseReady ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const root = document.getElementById('root');
const S = { user:null, authUser:null, view:'dashboard', date: todayStr(), chatWith:null, cache:{}, authMode:'login' };

function todayStr(d){ const x=d?new Date(d):new Date(); return x.toISOString().slice(0,10); }
function fmtDateLabel(ds){
  const d=new Date(ds+'T00:00:00');
  const t=new Date(todayStr()+'T00:00:00');
  const diff=Math.round((t-d)/86400000);
  const days=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
  if(diff===0) return 'Bugün';
  if(diff===1) return 'Dün';
  return days[d.getDay()]+' · '+d.getDate()+'/'+(d.getMonth()+1);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function avatarHtml(u, size){
  size = size||32;
  if(u && u.photo) return `<div class="avatar" style="width:${size}px;height:${size}px;"><img src="${u.photo}"></div>`;
  const name=(u&&u.displayName)||(u&&u.username)||'R';
  const initials=name.trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();
  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.34)}px;font-weight:700;">${esc(initials||'R')}</div>`;
}
const CAPTION_WORD_LIMIT = 40;
const SPORTS = [
  {id:'yuruyus', label:'Yürüyüş', icon:'🚶', met:3.8, distance:true},
  {id:'kosu', label:'Koşu', icon:'🏃', met:9.8, distance:true},
  {id:'bisiklet', label:'Bisiklet', icon:'🚴', met:7.5, distance:true},
  {id:'yuzme', label:'Yüzme', icon:'🏊', met:8.3, distance:true},
  {id:'futbol', label:'Futbol', icon:'⚽', met:7.0, distance:false},
  {id:'basketbol', label:'Basketbol', icon:'🏀', met:6.5, distance:false},
  {id:'voleybol', label:'Voleybol', icon:'🏐', met:4.0, distance:false},
  {id:'fitness', label:'Fitness', icon:'🏋️', met:5.0, distance:false},
  {id:'yoga', label:'Yoga/Pilates', icon:'🧘', met:2.8, distance:false},
  {id:'tenis', label:'Tenis', icon:'🎾', met:7.3, distance:false},
  {id:'diger', label:'Diğer', icon:'✨', met:5.0, distance:false},
];
function truncateWords(text, limit){
  if(!text) return {short:'', truncated:false};
  const words = text.trim().split(/\s+/);
  if(words.length<=limit) return {short:text, truncated:false};
  return {short:words.slice(0,limit).join(' ')+'…', truncated:true};
}
async function resizeFileToDataUrl(file, maxW, quality){
  return new Promise((resolve)=>{
    const img=new Image(); const reader=new FileReader();
    reader.onload=e=>{
      img.onload=()=>{
        const scale=Math.min(1, maxW/img.width);
        const canvas=document.createElement('canvas');
        canvas.width=img.width*scale; canvas.height=img.height*scale;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality||0.7));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ---------- Supabase storage helpers ----------
async function sGet(key, shared){
  if(!db) return JSON.parse(localStorage.getItem((shared?'shared:':'private:')+key)||'null');
  const storageKey=shared?key:`private:${S.authUser.id}:${key}`;
  const {data,error}=await db.from('app_data').select('value').eq('key',storageKey).maybeSingle();
  if(error){ console.error(error); return null; }
  return data?data.value:null;
}
async function sSet(key, val, shared){
  if(!db){ localStorage.setItem((shared?'shared:':'private:')+key,JSON.stringify(val)); return true; }
  if(val===null) return sDel(key,shared);
  const storageKey=shared?key:`private:${S.authUser.id}:${key}`;
  const {data:updated,error:updateError}=await db.from('app_data').update({value:val,updated_at:new Date().toISOString()}).eq('key',storageKey).select('key');
  if(updateError){ console.error(updateError); alert('Veri kaydedilemedi: '+updateError.message); return null; }
  if(updated&&updated.length) return true;
  const row={key:storageKey,value:val,visibility:shared?'shared':'private',owner_id:S.authUser.id,updated_at:new Date().toISOString()};
  const {error}=await db.from('app_data').insert(row);
  if(error){ console.error(error); alert('Veri kaydedilemedi: '+error.message); return null; }
  return true;
}
async function sList(prefix, shared){
  if(!db) return Object.keys(localStorage).filter(k=>k.startsWith((shared?'shared:':'private:')+prefix)).map(k=>k.replace(shared?'shared:':'private:',''));
  const storagePrefix=shared?prefix:`private:${S.authUser.id}:${prefix}`;
  const {data,error}=await db.from('app_data').select('key').like('key',storagePrefix+'%');
  if(error){ console.error(error); return []; }
  return (data||[]).map(x=>shared?x.key:x.key.replace(`private:${S.authUser.id}:`,''));
}
async function sDel(key, shared){
  if(!db){ localStorage.removeItem((shared?'shared:':'private:')+key); return true; }
  const storageKey=shared?key:`private:${S.authUser.id}:${key}`;
  const {data,error}=await db.from('app_data').delete().eq('key',storageKey).select('key');
  if(error){ alert('Silme yetkiniz yok veya işlem başarısız: '+error.message); return null; }
  if(!data||!data.length){ alert('Bu veriyi silme yetkiniz yok.'); return null; }
  return true;
}

// ---------- boot ----------
async function boot(){
  if(!db){ renderLogin(); return; }
  try{
    const query=new URLSearchParams(location.search);
    const code=query.get('code');
    if(code){
      const {error}=await db.auth.exchangeCodeForSession(code);
      if(error) throw error;
      history.replaceState({},document.title,location.pathname);
    }
    const {data:{session},error}=await db.auth.getSession();
    if(error) throw error;
    if(session) await completeSession(session.user);
    else renderLogin(query.get('error_description')||'');
  }catch(error){
    renderLogin('Doğrulama bağlantısı işlenemedi: '+error.message);
  }
  db.auth.onAuthStateChange((event,session)=>{
    if(event==='SIGNED_IN'&&session&&(!S.authUser||S.authUser.id!==session.user.id)) completeSession(session.user);
    if(event==='SIGNED_OUT'||!session){ S.user=null; S.authUser=null; renderLogin(); }
  });
}
async function completeSession(authUser){
  S.authUser=authUser;
  const {data:profile,error}=await db.from('profiles').select('*').eq('id',authUser.id).single();
  if(error||!profile){ renderLogin('Profil yüklenemedi. Lütfen tekrar giriş yapın.'); return; }
  S.user={username:profile.username,displayName:profile.display_name,photo:profile.photo_url||null,email:authUser.email,isAdmin:profile.is_admin};
  await ensureDirectory(S.user); render();
}
async function ensureDirectory(me){
  const entry = await sGet('user:'+me.username, true);
  if(!entry) await sSet('user:'+me.username, {displayName: me.displayName, photo: me.photo||null, email: me.email||null, joinedAt: Date.now()}, true);
}

function renderLogin(message=''){
  root.innerHTML = `
    <div class="login-wrap">
      <h1>Ritim</h1>
      <p class="muted" style="margin-bottom:24px;">Günlük düzenini takip et, arkadaşlarınla paylaş.</p>
      <div class="card">
        <div class="auth-tabs"><button id="tab-login" class="active" onclick="setAuthMode('login')">Giriş yap</button><button id="tab-register" onclick="setAuthMode('register')">Kayıt ol</button></div>
        <div id="register-fields" style="display:none;">
        <div class="field"><label>Kullanıcı adı (en az 4 karakter, benzersiz olmalı)</label><input id="in-username" placeholder="ör. erenk"></div>
        <div class="field"><label>Görünen ad</label><input id="in-display" placeholder="ör. Eren"></div>
        <div class="field"><label>Profil fotoğrafı (isteğe bağlı)</label><input type="file" id="in-photo" accept="image/*"></div>
        </div>
        <div class="field"><label>E-posta</label><input id="in-email" type="email" autocomplete="email" placeholder="ör. eren@mail.com"></div>
        <div class="field"><label>Şifre</label><input id="in-password" type="password" autocomplete="current-password" minlength="6" placeholder="En az 6 karakter"></div>
        <button type="button" id="auth-submit" class="btn-primary" style="width:100%;margin-top:6px;" onclick="submitAuth()">Giriş yap</button>
        <p id="auth-error" class="auth-error">${esc(message||(supabaseReady?'':'Supabase URL ve publishable key değerlerini kodun başına ekleyin.'))}</p>
      </div>
    </div>`;
}
function setAuthMode(mode){
  S.authMode=mode;
  document.getElementById('register-fields').style.display=mode==='register'?'block':'none';
  document.getElementById('tab-login').classList.toggle('active',mode==='login');
  document.getElementById('tab-register').classList.toggle('active',mode==='register');
  document.getElementById('auth-submit').textContent=mode==='login'?'Giriş yap':'Hesap oluştur';
  document.getElementById('in-password').autocomplete=mode==='login'?'current-password':'new-password';
}
async function submitAuth(){ if(S.authMode==='login') return doLogin(); return doRegister(); }
async function doLogin(){
  if(!db){ showAuthError('Önce Supabase bağlantı bilgilerini ekleyin.'); return; }
  const email=document.getElementById('in-email').value.trim();
  const password=document.getElementById('in-password').value;
  if(!email||!password){ showAuthError('E-posta ve şifreni gir.'); return; }
  setAuthLoading(true);
  try{
    const {data,error}=await db.auth.signInWithPassword({email,password});
    if(error) throw error;
    await completeSession(data.user);
  }catch(error){ showAuthError('Giriş yapılamadı: '+authErrorTr(error.message)); }
  finally{ setAuthLoading(false); }
}
async function doRegister(){
  if(!db){ showAuthError('Önce Supabase bağlantı bilgilerini ekleyin.'); return; }
  const username = document.getElementById('in-username').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
  const email = document.getElementById('in-email').value.trim();
  const displayName = document.getElementById('in-display').value.trim() || username;
  const password = document.getElementById('in-password').value;
  if(!username || username.length<4){ alert('Kullanıcı adı en az 4 karakter olmalı.'); return; }
  if(!email || !email.includes('@')){ alert('Geçerli bir e-posta adresi gir.'); return; }
  if(password.length<6){ alert('Şifre en az 6 karakter olmalı.'); return; }
  const photoFile = document.getElementById('in-photo').files[0];
  let photo = null;
  if(photoFile) photo = await resizeFileToDataUrl(photoFile, 220, 0.75);
  setAuthLoading(true);
  try{
    const redirectTo=location.origin+location.pathname;
    const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:redirectTo,data:{username,display_name:displayName,photo_url:photo}}});
    if(error) throw error;
    if(data.session) await completeSession(data.user);
    else { S.authMode='login'; renderLogin('Hesap oluşturuldu. E-postandaki doğrulama bağlantısına tıkla, ardından giriş yap.'); }
  }catch(error){ showAuthError('Kayıt oluşturulamadı: '+authErrorTr(error.message)); }
  finally{ setAuthLoading(false); }
}
function showAuthError(message){ const el=document.getElementById('auth-error'); if(el) el.textContent=message; }
function setAuthLoading(loading){
  const btn=document.getElementById('auth-submit'); if(!btn) return;
  btn.disabled=loading; btn.style.opacity=loading?'.65':'1';
  btn.textContent=loading?'Lütfen bekle…':(S.authMode==='login'?'Giriş yap':'Hesap oluştur');
}
function authErrorTr(message){
  const m=(message||'').toLowerCase();
  if(m.includes('invalid login credentials')) return 'E-posta veya şifre yanlış.';
  if(m.includes('email not confirmed')) return 'Önce e-postandaki doğrulama bağlantısına tıkla.';
  if(m.includes('user already registered')) return 'Bu e-posta zaten kayıtlı. Giriş yapmayı dene.';
  return message||'Bilinmeyen bir hata oluştu.';
}
async function doLogout(){
  if(db) await db.auth.signOut();
  S.user=null; S.authUser=null; renderLogin();
}

// ---------- shell ----------
function render(){
  root.innerHTML = `
    <div class="top">
      <div class="greet">${greeting()}, ${esc(S.user.displayName)}</div>
      <div class="sub">${fmtDateLabel(S.date)}</div>
    </div>
    <div class="content" id="content"></div>
    <div class="nav">

async function loadDay(date){
  const key = 'log:'+date;
  let d = await sGet(key, false);
  if(!d) d = {calories:[], sleep:{bed:'',wake:''}, water:0, work:[], moves:[]};
  if(!d.work) d.work=[];
  if(d.study && d.study.length){
    d.work = d.work.concat(d.study.map(s=>({...s, kind: s.kind||'ders'})));
    delete d.study;
    await saveDay(date, d);
  }
  return d;
}

function sleepHours(sleep){
  if(!sleep || !sleep.bed || !sleep.wake) return null;
  let [bh,bm]=sleep.bed.split(':').map(Number);
  let [wh,wm]=sleep.wake.split(':').map(Number);
  let bed=bh*60+bm, wake=wh*60+wm;
  let diff=wake-bed; if(diff<=0) diff+=24*60;
  return (diff/60).toFixed(1);
}
function computeTargets(body){
  if(!body || !body.weight || !body.height) return null;
  const w=Number(body.weight), h=Number(body.height), age=Number(body.age)||25;
  if(!w || !h) return null;
  let bmr;
  if(body.gender==='erkek') bmr = 10*w + 6.25*h - 5*age + 5;
  else if(body.gender==='kadin') bmr = 10*w + 6.25*h - 5*age - 161;
  else bmr = 10*w + 6.25*h - 5*age - 78; // ortalama / belirtilmemiş
  const calories = Math.round(bmr*1.375); // hafif aktif varsayımı
  const mlPerKg = body.gender==='erkek'? 35 : body.gender==='kadin'? 31 : 33;
  const waterMl = Math.round(w*mlPerKg);
  const waterGlasses = Math.max(1, Math.round(waterMl/250));
  return {calories, waterMl, waterGlasses};
}

function resizeImage(file, maxW){
  return new Promise((resolve)=>{
    const img=new Image();
    const reader=new FileReader();
    reader.onload=e=>{
      img.onload=()=>{
        const scale=Math.min(1, maxW/img.width);
        const canvas=document.createElement('canvas');
        canvas.width=img.width*scale; canvas.height=img.height*scale;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.65));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
async function handlePhotoCal(ev){
  const file=ev.target.files[0]; if(!file) return;
  document.getElementById('ph-status').textContent='Fotoğraf işleniyor…';
  const dataUrl = await resizeImage(file, 700);
  S.cache.lastPhoto = dataUrl;
  document.getElementById('ph-status').textContent='Yapay zeka analiz ediyor…';
  try{
    const base64 = dataUrl.split(',')[1];
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:300,
        messages:[{
          role:'user',
          content:[
            {type:'image', source:{type:'base64', media_type:'image/jpeg', data:base64}},
            {type:'text', text:'Bu fotoğraftaki yemeği tanı ve yaklaşık kalorisini tahmin et. Sadece şu JSON formatında, başka hiçbir açıklama olmadan yanıt ver: {"food_name":"...", "estimated_calories": number, "note":"kısa bir not, örn. porsiyon varsayımı"}. Yanıtın Türkçe olsun.'}
          ]
        }]
      })
    });
    const data = await resp.json();
    const text = (data.content||[]).map(b=>b.text||'').join('');
    const clean = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    S.cache.lastEstimate = parsed;
    document.getElementById('ph-status').textContent='';
    document.getElementById('ph-result').innerHTML = `
      <div class="card" style="margin-top:4px;">
        <img src="${dataUrl}" style="width:100%;border-radius:10px;margin-bottom:8px;">
        <div class="field"><label>Yemek</label><input id="ai-name" value="${esc(parsed.food_name||'')}"></div>
        <div class="field"><label>Tahmini kalori</label><input id="ai-kcal" type="number" value="${parsed.estimated_calories||''}"></div>
        <p class="muted" style="font-size:12px;">${esc(parsed.note||'')} — bu bir tahmindir, düzenleyebilirsin.</p>
        <button class="btn-primary" style="width:100%;" onclick="confirmAiCal()">Günlüğe ekle</button>
      </div>`;
  }catch(e){
    document.getElementById('ph-status').textContent='Analiz başarısız oldu, elle ekleyebilirsin.';
  }
}

    <h3 style="margin-bottom:10px;">Aktivite ekle</h3>
    <div class="sport-grid">
      ${SPORTS.map(s=>`<div class="sport-btn ${s.id===sport.id?'active':''}" onclick="pickSport('${s.id}')"><span class="ic">${s.icon}</span>${s.label}</div>`).join('')}
    </div>
    ${sport.distance? `<div class="field"><label>Mesafe (km)</label><input id="mv-km" type="number" step="0.1" inputmode="decimal" value="${S.cache.moveKm}" oninput="onMoveFieldChange()"></div>`:''}
    <div class="field"><label>Süre (dakika)</label><input id="mv-min" type="number" inputmode="numeric" value="${S.cache.moveMin}" oninput="onMoveFieldChange()"></div>
    <div class="field"><label>Tahmini kalori</label><input id="mv-kcal" type="number" inputmode="numeric" value="${initialKcal}"></div>
    <button class="btn-primary" style="width:100%;" onclick="addMove()">Ekle</button>
    <p class="muted" style="font-size:11px;margin-top:8px;">Bu bir tahmindir — şu an akıllı bir bileklik/saatten veri almıyoruz. Süreyi girdiğinde kalori otomatik hesaplanır, ama sen de dilediğin gibi değiştirebilirsin.</p>
  `;
}
function pickSport(id){
  const minEl=document.getElementById('mv-min'), kmEl=document.getElementById('mv-km');
  if(minEl) S.cache.moveMin = minEl.value;
  if(kmEl) S.cache.moveKm = kmEl.value;
  S.cache.moveSport = id;
  updateModalContent(moveModalHtml());
}
function onMoveFieldChange(){
  const minEl=document.getElementById('mv-min'), kmEl=document.getElementById('mv-km');
  S.cache.moveMin = minEl? minEl.value : '';
  S.cache.moveKm = kmEl? kmEl.value : '';
  const est = estimateKcal(S.cache.moveSport, S.cache.moveMin);
  const kcalEl = document.getElementById('mv-kcal');
  if(kcalEl && est!=='') kcalEl.value = est;
}
async function addMove(){
  const sport = SPORTS.find(s=>s.id===S.cache.moveSport);
  const min = Number(document.getElementById('mv-min').value)||0;
  const kmField = document.getElementById('mv-km');
  const km = kmField? (Number(kmField.value)||0) : 0;
  if(!min){ alert('Süreyi gir.'); return; }
  const kcalVal = document.getElementById('mv-kcal').value;
  const kcal = kcalVal!==''? Number(kcalVal) : null;
  const day = await loadDay(S.date);
  day.moves.push({id:uid(), type:sport.id, label:sport.label, icon:sport.icon, min, km: sport.distance? km: null, kcal});
  await saveDay(S.date,day);
  closeModal(); renderDashboard(document.getElementById('content'));
}

async function renderFeed(c){
  c.innerHTML='<div class="empty">Yükleniyor…</div>';
  let index = await sGet('feed_index', true) || [];
  const posts = [];
  for(const id of index.slice(0,30)){
    const p = await sGet('post:'+id, true);

  }
  c.innerHTML = `
    <button class="btn-primary" style="width:100%;margin-bottom:14px;" onclick="openNewPost()">＋ Yeni gönderi</button>
    ${posts.length? posts.map(postCard).join(''): '<div class="empty">Henüz gönderi yok. İlk paylaşımı sen yap!</div>'}
  `;
}
function postCard(p){
  const you = S.user.username;
  const liked = (p.likes||[]).includes(you);
  const cap = truncateWords(p.caption, CAPTION_WORD_LIMIT);
  const comments = p.comments||[];
  const visibleComments = comments.slice(-2);
  const hiddenCount = comments.length - visibleComments.length;
  return `
    <div class="post">
      <div class="head">
        ${avatarHtml(p,32)}
        <div><div style="font-size:13.5px;font-weight:600;">${esc(p.displayName)}</div><div class="muted" style="font-size:11px;">${timeAgo(p.ts)}</div></div>
        ${(p.username===S.user.username||S.user.isAdmin)?`<div class="post-actions"><button class="btn-ghost btn-sm danger" onclick="deletePost('${p.id}')">Sil</button></div>`:''}
      </div>
      ${p.image? `<img src="${p.image}" onclick="openPostDetail('${p.id}')" style="cursor:pointer;">`:''}
      <div class="body">
        ${cap.short? `<div style="font-size:14px;margin-bottom:6px;">${esc(cap.short)}</div>`:''}
        ${cap.truncated? `<div class="read-more" onclick="openPostDetail('${p.id}')">Devamını oku</div>`:''}
        <div class="row" style="margin:8px 0 4px;">
          <button class="btn-ghost btn-sm" onclick="toggleLike('${p.id}')">${liked?'❤️':'🤍'} ${(p.likes||[]).length}</button>
          <span class="muted" style="font-size:12px;">${comments.length} yorum</span>
        </div>
        ${visibleComments.map(cm=>`<div class="comment"><b>${esc(cm.displayName)}:</b> ${esc(cm.text)}</div>`).join('')}
        ${hiddenCount>0? `<div class="read-more" onclick="openPostDetail('${p.id}')">${hiddenCount} yorum daha gör</div>`:''}
        <div class="row" style="margin-top:8px;gap:6px;">
          <input id="cm-${p.id}" placeholder="Yorum yaz…" style="flex:1;">
          <button class="btn-ghost btn-sm" onclick="addComment('${p.id}')">Gönder</button>
        </div>
      </div>
    </div>`;
}
function timeAgo(ts){
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'şimdi';
  if(s<3600) return Math.floor(s/60)+' dk önce';
  if(s<86400) return Math.floor(s/3600)+' sa önce';
  return Math.floor(s/86400)+' gün önce';
}
function openNewPost(){
  showModal(`
    <h3 style="margin-bottom:12px;">Yeni gönderi</h3>
    <input type="file" id="post-file" accept="image/*">
    <div class="field" style="margin-top:10px;"><label>Açıklama</label><textarea id="post-caption" rows="3" placeholder="Bugün ne yaptın?"></textarea></div>
    <p class="muted" style="font-size:11.5px;margin-top:-4px;margin-bottom:10px;">Akışta ilk ${CAPTION_WORD_LIMIT} kelime gösterilir, devamı "Devamını oku" ile açılır — istediğin kadar uzun yazabilirsin.</p>
    <button class="btn-primary" style="width:100%;" onclick="publishPost()">Paylaş</button>
  `);
}
async function publishPost(){
  const file = document.getElementById('post-file').files[0];
  const caption = document.getElementById('post-caption').value.trim();
  let image = null;
  if(file) image = await resizeImage(file, 800);
  const id = uid();
  const post = {id, username:S.user.username, displayName:S.user.displayName, photo:S.user.photo, image, caption, ts:Date.now(), likes:[], comments:[]};
  await sSet('post:'+id, post, true);
  let index = await sGet('feed_index', true) || [];
  index.unshift(id); index = index.slice(0,200);
  await sSet('feed_index', index, true);
  closeModal(); renderFeed(document.getElementById('content'));
}
async function deletePost(id){
  const p=await sGet('post:'+id,true); if(!p) return;
  if(p.username!==S.user.username&&!S.user.isAdmin){ alert('Bu gönderiyi silme yetkiniz yok.'); return; }
  if(!confirm('Bu gönderi kalıcı olarak silinsin mi?')) return;
  const deleted=await sDel('post:'+id,true); if(!deleted) return;
  let index=await sGet('feed_index',true)||[];
  index=index.filter(postId=>postId!==id);
  await sSet('feed_index',index,true);
  closeModal();
  if(S.view==='feed') renderFeed(document.getElementById('content')); else renderView();
}
async function toggleLike(id){
  const p = await sGet('post:'+id, true); if(!p) return;
  p.likes = p.likes||[];
  const you=S.user.username;
  if(p.likes.includes(you)) p.likes=p.likes.filter(u=>u!==you); else p.likes.push(you);
  await sSet('post:'+id, p, true);
  renderFeed(document.getElementById('content'));
}
async function addComment(id){
  const input=document.getElementById('cm-'+id);
  const text=input.value.trim(); if(!text) return;
  const p = await sGet('post:'+id, true); if(!p) return;
  p.comments = p.comments||[];
  p.comments.push({username:S.user.username, displayName:S.user.displayName, text, ts:Date.now()});
  await sSet('post:'+id, p, true);
  renderFeed(document.getElementById('content'));
}

async function openPostDetail(id){

async function renderFriends(c){

async function addFriend(){
  const uname = document.getElementById('add-friend').value.trim().toLowerCase();
  if(!uname || uname===S.user.username) return;
  const target = await sGet('user:'+uname, true);
  if(!target){ alert('Bu kullanıcı adı bulunamadı.'); return; }
  const my = await getSocial(S.user.username);
  if(!my.following.includes(uname)){ my.following.push(uname); await sSet('social:'+S.user.username, my, true); }
  const their = await getSocial(uname);
  if(!their.followers.includes(S.user.username)){ their.followers.push(S.user.username); await sSet('social:'+uname, their, true); }
  renderFriends(document.getElementById('content'));
}

// ================= CHAT (24h auto-delete) =================
function roomId(a,b){ return [a,b].sort().join('__'); }
async function loadRoom(a,b){
  const key='chat:'+roomId(a,b);
  let msgs = await sGet(key, true) || [];
  const cutoff = Date.now() - 24*3600*1000;
  const fresh = msgs.filter(m=>m.ts>cutoff);
  if(fresh.length!==msgs.length) await sSet(key, fresh, true);
  return fresh;
}
async function renderChatList(c){
  const social = await getSocial(S.user.username);
  const contacts = Array.from(new Set([...social.following, ...social.followers]));
  const details=[];
  for(const u of contacts){ const info=await sGet('user:'+u,true); if(info) details.push({username:u,...info}); }
  c.innerHTML = `
    <div class="card" style="padding:10px 14px;"><p class="muted" style="font-size:12px;">Özel mesajlar 24 saat sonra otomatik silinir.</p></div>
    ${details.length? details.map(d=>`
      <div class="card" style="cursor:pointer;" onclick="openChat('${d.username}')">
        <div class="row" style="gap:8px;">${avatarHtml(d,32)}<div>${esc(d.displayName)}</div></div>
      </div>`).join(''): '<div class="empty">Sohbet için önce Kişiler sekmesinden birini takip et.</div>'}
  `;
}
async function openChat(username){
  S.chatWith = username;
  const c = document.getElementById('content');
  c.innerHTML = `<div class="empty">Yükleniyor…</div>`;
  const info = await sGet('user:'+username, true);
  const msgs = await loadRoom(S.user.username, username);
  c.innerHTML = `
    <button class="btn-ghost btn-sm" onclick="switchView('chat')">‹ Geri</button>
    <h3 style="margin:12px 0;">${esc(info? info.displayName: username)}</h3>
    <div id="chat-box" style="display:flex;flex-direction:column;margin-bottom:10px;">
      ${msgs.length? msgs.map(m=>`<div class="chat-bubble ${m.from===S.user.username?'chat-me':'chat-them'}">${esc(m.text)}</div>`).join(''): '<div class="empty">Henüz mesaj yok</div>'}
    </div>
    <div class="row" style="gap:6px;">
      <input id="chat-input" placeholder="Mesaj yaz…">
      <button class="btn-primary btn-sm" onclick="sendChat()">Gönder</button>
    </div>
  `;
}
async function sendChat(){
  const input=document.getElementById('chat-input');
  const text=input.value.trim(); if(!text) return;
  const key='chat:'+roomId(S.user.username, S.chatWith);
  const msgs = await loadRoom(S.user.username, S.chatWith);
  msgs.push({from:S.user.username, text, ts:Date.now()});
  await sSet(key, msgs, true);
  openChat(S.chatWith);
}

}
async function confirmRenameUser(oldUsername){
  const newUsername = document.getElementById('rename-input').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
  if(!newUsername || newUsername.length<4){ alert('Kullanıcı adı en az 4 karakter olmalı.'); return; }
  if(newUsername===oldUsername){ closeModal(); return; }
  const {data:target,error:findError}=await db.from('profiles').select('id').eq('username',oldUsername).single();
  if(findError||!target){ alert('Kullanıcı bulunamadı.'); return; }
  const {error}=await db.from('profiles').update({username:newUsername}).eq('id',target.id);
  if(error){ alert(error.code==='23505'?'Bu kullanıcı adı zaten kullanılıyor.':'Kullanıcı adı değiştirilemedi: '+error.message); return; }
  if(S.user.username===oldUsername){
    S.user.username = newUsername;
  }
  closeModal(); renderAdmin(document.getElementById('content'));
}

// ================= MODAL =================
function showModal(html){
  const bg=document.createElement('div');
  bg.className='modal-bg'; bg.id='modal-bg';
  bg.innerHTML=`<div class="modal" style="position:relative;">${html}<div class="close-x" onclick="closeModal()">✕</div></div>`;
  bg.addEventListener('click', e=>{ if(e.target.id==='modal-bg') closeModal(); });
  document.body.appendChild(bg);
}
function closeModal(){ const m=document.getElementById('modal-bg'); if(m) m.remove(); renderView(); }

boot();
</script>
