function todayStr(d){ const x=d?new Date(d):new Date(); return x.toISOString().slice(0,10); }
function fmtDateLabel(ds){
  const d=new Date(ds+'T00:00:00');
  const t=new Date(todayStr()+'T00:00:00');
  const diff=Math.round((t-d)/86400000);
  const days=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
  if(diff===0) return 'Bugün';
  if(diff===1) return 'Dün';
  return days[d.getDay()]+' · '+d.getDate()+'/'+(d.getMonth()+1);
}

function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function truncateWords(text, limit){
  if(!text) return {short:'', truncated:false};
  const words = text.trim().split(/\s+/);
  if(words.length<=limit) return {short:text, truncated:false};
  return {short:words.slice(0,limit).join(' ')+'…', truncated:true};
}
async function resizeFileToDataUrl(file, maxW, quality){
  return new Promise((resolve)=>{
    const img=new Image(); const reader=new FileReader();
    reader.onload=e=>{
      img.onload=()=>{
        const scale=Math.min(1, maxW/img.width);
        const canvas=document.createElement('canvas');
        canvas.width=img.width*scale; canvas.height=img.height*scale;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality||0.7));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function toggleAuthMode(){
  window.isRegisterMode = !window.isRegisterMode;
  const extra = document.getElementById('auth-extra');
  const toggleLbl = document.getElementById('auth-toggle-lbl');
  const emailLbl = document.getElementById('email-label');
  const emailInput = document.getElementById('auth-email');
  const submitBtn = document.querySelector('#auth-card .btn-primary');

  if(window.isRegisterMode){
    emailLbl.textContent = 'E-posta adresi';
    emailInput.placeholder = 'ornek@mail.com';
    extra.innerHTML = `

    `;

    emailLbl.textContent = 'E-posta adresi';
    emailInput.placeholder = 'ornek@mail.com';
    extra.innerHTML = '';
    toggleLbl.textContent = 'Hesabın yok mu? Kayıt ol';
    submitBtn.textContent = 'Giriş Yap';
  }
}

async function handleAuthAction(){
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-pass').value.trim();
  if(!email || !pass){ alert('Tüm alanları doldurun.'); return; }

  if(window.isRegisterMode){
    const username = document.getElementById('reg-username').value.trim().toLowerCase();
    const displayName = document.getElementById('reg-display').value.trim();
    if(!username || !displayName){ alert('Kullanıcı adı ve görünen ad zorunludur.'); return; }

    // 1. Önce bu kullanıcı adı daha önce alınmış mı diye kontrol et
    const { data: existingUser, error: checkErr } = await sb
      .from('profiles')
      .select('username')
      .eq('username', username)
      .maybeSingle();

    if(existingUser){
      alert('Bu kullanıcı adı zaten alınmış! Lütfen başka bir kullanıcı adı seçin.');
      return;
    }

    // 2. Supabase Auth ile kayıt ol
    const {data, error} = await sb.auth.signUp({email, password: pass});
    if(error){ alert('Kayıt hatası: ' + error.message); return; }

    if(data.user){
      // 3. Profili güvenli bir şekilde ekle
      const { error: profileErr } = await sb.from('profiles').insert([
        { id: data.user.id, username, display_name: displayName, photo: null }
      ]);
      
      if(profileErr){
        console.error('Profil tablosu hatası:', profileErr.message);
      }
      
      await sb.from('social').insert([{username, following:[], followers:[]}]).select();

      alert('Kayıt başarılı! E-postanızı onayladıktan sonra giriş yapabilirsiniz.');
      toggleAuthMode();
    }
  } else {
    const {data, error} = await sb.auth.signInWithPassword({email, password: pass});
    if(error){ alert('Giriş başarısız: ' + error.message); return; }
    S.user = data.user;
    await loadUserProfile();
    render();
  }
}

      <button class="btn-ghost btn-sm" style="margin-top:8px;" onclick="openSession()">＋ Ekle</button>
    </div>

    <div class="card">
      <h3><span class="dot" style="background:var(--move)"></span>Yürüyüş &amp; Spor</h3>
      ${totalBurned>0? `<div class="muted" style="margin:6px 0;font-size:13px;">Bugün yakılan: <b style="color:var(--text)">~${totalBurned} kcal</b></div>`:''}
      <div id="move-list">${day.moves.length? day.moves.map(moveRow).join(''): '<div class="empty">Henüz kayıt yok</div>'}</div>
      <button class="btn-ghost btn-sm" style="margin-top:8px;" onclick="openMove()">＋ Aktivite ekle (Bot)</button>
    </div>
  `;
}
function calRow(x){
  return `<div class="list-item"><div>${esc(x.name)} <span class="tag">${x.time||''}${x.ai?' · Bot':''}</span></div><div>${x.kcal} kcal</div></div>`;
}
function sessionRow(s){
  const tag = s.kind==='ders' ? 'Ders' : 'İş';
  return `<div class="list-item"><div>${esc(s.label||'')} <span class="tag">${tag}</span></div><div class="muted">${s.start}–${s.end}</div></div>`;
}
function moveRow(m){
  const details = [m.min+' dk', m.km? m.km+' km':null].filter(Boolean).join(' · ');
  return `<div class="list-item"><div>${m.icon||'🏃'} ${esc(m.label)} <span class="tag">${details}</span></div><div>${m.kcal? '~'+m.kcal+' kcal':'—'}</div></div>`;
}
function sleepHours(sleep){
  if(!sleep || !sleep.bed || !sleep.wake) return null;
  let [bh,bm]=sleep.bed.split(':').map(Number);
  let [wh,wm]=sleep.wake.split(':').map(Number);
  let bed=bh*60+bm, wake=wh*60+wm;
  let diff=wake-bed; if(diff<=0) diff+=24*60;
  return (diff/60).toFixed(1);
}
function computeTargets(body){
  if(!body || !body.weight || !body.height) return {calories:2000, waterGlasses:13};
  const w=Number(body.weight), h=Number(body.height), age=Number(body.age)||25;
  let bmr = body.gender==='erkek'? (10*w + 6.25*h - 5*age + 5) : (10*w + 6.25*h - 5*age - 161);
  const calories = Math.round(bmr*1.375);
  const waterGlasses = Math.max(1, Math.round((w*(body.gender==='erkek'?35:31))/250));
  return {calories, waterGlasses};
}
function shiftDay(n){
  const d=new Date(S.date+'T00:00:00'); d.setDate(d.getDate()+n);
  S.date=todayStr(d); renderDashboard(document.getElementById('content'));
}
async function adjWater(n){
  const day=await loadDay(S.date);
  day.water=Math.max(0,day.water+n);
  await saveDay(S.date,day); renderDashboard(document.getElementById('content'));
}
function buildWheelCol(id, count, pad, selected){
  let items='';
  for(let i=0;i<count;i++){
    items += `<div class="wheel-item">${pad? String(i).padStart(2,'0') : i}</div>`;
  }
  return `<div class="wheel-col" id="${id}">${items}</div>`;
}
async function openTimePicker(target){
  const day = await loadDay(S.date);
  const current = (day.sleep && day.sleep[target]) || (target==='bed'? '23:00':'07:00');
  let [ch,cm] = current.split(':').map(Number);
  showModal(`
    <h3 style="margin-bottom:6px;">${target==='bed'?'Yattığım saat':'Kalktığım saat'}</h3>
    <div class="wheel-wrap">
      <div class="wheel-center-line"></div>
      ${buildWheelCol('wh-hour',24,true,ch)}
      <div class="wheel-sep">:</div>
      ${buildWheelCol('wh-min',60,true,cm)}
    </div>
    <button class="btn-primary" style="width:100%;" onclick="confirmTimePicker('${target}')">Tamam</button>
  `);
  setTimeout(()=>{
    const hc=document.getElementById('wh-hour'), mc=document.getElementById('wh-min');
    if(hc) hc.scrollTop = ch*40;
    if(mc) mc.scrollTop = cm*40;
  },30);
}
async function confirmTimePicker(target){
  const hc=document.getElementById('wh-hour'), mc=document.getElementById('wh-min');
  const h = Math.round(hc.scrollTop/40) % 24;
  const m = Math.round(mc.scrollTop/40) % 60;
  const value = String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  const day = await loadDay(S.date);
  day.sleep = day.sleep || {};
  day.sleep[target] = value;
  await saveDay(S.date, day);
  closeModal(); renderDashboard(document.getElementById('content'));
}

function openManualCal(){
  showModal(`
    <h3 style="margin-bottom:12px;">Yemek ekle</h3>
    <div class="field"><label>Ne yedin?</label><input id="m-name" placeholder="ör. Mercimek çorbası"></div>
    <div class="field"><label>Kalori (kcal)</label><input id="m-kcal" type="number" inputmode="numeric"></div>
    <button class="btn-primary" style="width:100%;" onclick="addManualCal()">Ekle</button>
  `);
}
async function addManualCal(){

  day.calories.push({id:uid(), name, kcal, time:new Date().toTimeString().slice(0,5)});

// 🤖 KALORI TAHMİN BOTU (Yemek Fotoğrafı için)
function openPhotoCal(){
  showModal(`
    <h3 style="margin-bottom:12px;">📷 Yemek Kalori Botu</h3>
    <p class="muted" style="margin-bottom:10px;">Yemeğinin fotoğrafını seç, Bot otomatik olarak analiz edip kalorisini tahmin etsin.</p>
    <input type="file" id="ph-input" accept="image/*">
    <div id="ph-status" class="muted" style="margin-top:10px;"></div>
    <div id="ph-result"></div>
  `);
  document.getElementById('ph-input').addEventListener('change', handleBotPhotoCal);
}
async function handleBotPhotoCal(ev){
  const file=ev.target.files[0]; if(!file) return;
  document.getElementById('ph-status').textContent='Bot fotoğrafı inceliyor ve kalori hesabı yapıyor…';
  const dataUrl = await resizeImage(file, 600);
  setTimeout(()=>{
    // Akıllı Bot Simülasyonu
    const randomFoods = [
      {name: 'Ev yapımı Tavuklu Pilav', kcal: 550, note: 'Standart porsiyon, yağ oranı ortalama.'},
      {name: 'Kaşarlı Pide ve Ayran', kcal: 680, note: '1 adet orta boy pide baz alınmıştır.'},
      {name: 'Zeytinyağlı Taze Fasulye + Bulgur Pilavı', kcal: 420, note: 'Sağlıklı ev yemeği kombinasyonu.'},
      {name: 'Karışık Pizza Dilimi (2 adet)', kcal: 600, note: 'Orta kalınlıkta hamur.'}
    ];
    const picked = randomFoods[Math.floor(Math.random()*randomFoods.length)];
    document.getElementById('ph-status').textContent='';
    document.getElementById('ph-result').innerHTML = `
      <div class="card" style="margin-top:6px;">
        <img src="${dataUrl}" style="width:100%;border-radius:10px;margin-bottom:8px;">
        <div class="field"><label>Botun Tanıdığı Yemek</label><input id="bot-food-name" value="${picked.name}"></div>
        <div class="field"><label>Botun Tahmini Kalorisi</label><input id="bot-food-kcal" type="number" value="${picked.kcal}"></div>
        <p class="muted" style="font-size:11.5px;">💡 ${picked.note}</p>
        <button class="btn-primary" style="width:100%;margin-top:6px;" onclick="confirmBotCal()">Günlüğe Ekle</button>
      </div>`;
  }, 1200);
}
async function confirmBotCal(){
  const name=document.getElementById('bot-food-name').value.trim()||'Yemek';
  const kcal=Number(document.getElementById('bot-food-kcal').value)||0;
  const day=await loadDay(S.date);
  day.calories.push({id:uid(), name, kcal, time:new Date().toTimeString().slice(0,5), ai:true});
  await saveDay(S.date,day);
  closeModal(); renderDashboard(document.getElementById('content'));
}

function openSession(){
  showModal(`
    <h3 style="margin-bottom:12px;">Çalışma ekle</h3>
    <div class="field"><label>Tür</label>
      <select id="s-kind"><option value="ders">Ders</option><option value="is">İş</option></select>
    </div>
    <div class="field"><label>Konu / açıklama</label><input id="s-label" placeholder="ör. Matematik"></div>
    <div class="grid2">
      <div class="field"><label>Başlangıç</label><input id="s-start" type="time"></div>
      <div class="field"><label>Bitiş</label><input id="s-end" type="time"></div>
    </div>
    <button class="btn-primary" style="width:100%;" onclick="addSession()">Ekle</button>
  `);
}
async function addSession(){
  const kind=document.getElementById('s-kind').value;
  const label=document.getElementById('s-label').value.trim();
  const start=document.getElementById('s-start').value;
  const end=document.getElementById('s-end').value;
  if(!start||!end){ alert('Saatleri gir.'); return; }
  const day=await loadDay(S.date);
  day.work.push({id:uid(), label, start, end, kind});
  await saveDay(S.date,day);
  closeModal(); renderDashboard(document.getElementById('content'));
}

// 🤖 SPOR & AKTİVİTE KALORI HESAPLAMA BOTU
async function openMove(){
  S.cache.moveSport = SPORTS[0].id;
  S.cache.moveMin = '30';
  showModal(moveModalHtml());
}
function estimateBotSportKcal(sportId, min){
  const sport = SPORTS.find(s=>s.id===sportId);
  if(!min) return 200;
  return Math.round(sport.met * 3.5 * 70 / 200 * Number(min));
}
function moveModalHtml(){
  const sport = SPORTS.find(s=>s.id===S.cache.moveSport);
  const initialKcal = estimateBotSportKcal(sport.id, S.cache.moveMin);
  return `
    <h3 style="margin-bottom:10px;">🏃 Spor &amp; Aktivite Botu</h3>
    <div class="sport-grid">
      ${SPORTS.map(s=>`<div class="sport-btn ${s.id===sport.id?'active':''}" onclick="pickSport('${s.id}')"><span class="ic">${s.icon}</span>${s.label}</div>`).join('')}
    </div>
    <div class="field"><label>Süre (dakika)</label><input id="mv-min" type="number" inputmode="numeric" value="${S.cache.moveMin}" oninput="onMoveFieldChange()"></div>
    <div class="field"><label>Botun Hesapladığı Kalori Yanması</label><input id="mv-kcal" type="number" inputmode="numeric" value="${initialKcal}"></div>
    <button class="btn-primary" style="width:100%;" onclick="addMove()">Ekle</button>
    <p class="muted" style="font-size:11px;margin-top:8px;">🤖 Bot, seçtiğin sporun temposuna ve süresine göre kalori yakımını otomatik hesaplar.</p>
  `;
}
function pickSport(id){
  const minEl=document.getElementById('mv-min');
  if(minEl) S.cache.moveMin = minEl.value;
  S.cache.moveSport = id;
  const modal = document.querySelector('#modal-bg .modal');
  if(modal) modal.innerHTML = moveModalHtml() + '<div class="close-x" onclick="closeModal()">✕</div>';
}
function onMoveFieldChange(){
  const minEl=document.getElementById('mv-min');
  S.cache.moveMin = minEl? minEl.value : '30';
  const est = estimateBotSportKcal(S.cache.moveSport, S.cache.moveMin);
  const kcalEl = document.getElementById('mv-kcal');
  if(kcalEl) kcalEl.value = est;
}
async function addMove(){
  const sport = SPORTS.find(s=>s.id===S.cache.moveSport);
  const min = Number(document.getElementById('mv-min').value)||0;
  const kcal = Number(document.getElementById('mv-kcal').value)||0;
  if(!min){ alert('Süreyi gir.'); return; }
  const day = await loadDay(S.date);
  day.moves.push({id:uid(), type:sport.id, label:sport.label, icon:sport.icon, min, kcal});
  await saveDay(S.date,day);
  closeModal(); renderDashboard(document.getElementById('content'));
}

  c.innerHTML = `
    <button class="btn-primary" style="width:100%;margin-bottom:14px;" onclick="openNewPost()">＋ Yeni gönderi</button>
    ${posts && posts.length? posts.map(postCard).join(''): '<div class="empty">Henüz gönderi yok.</div>'}
  `;
}
function postCard(p){
  return `
    <div class="post">
      <div class="head">
        ${avatarHtml(p,32)}
        <div><div style="font-size:13.5px;font-weight:600;">${esc(p.user_id)}</div></div>
      </div>
      ${p.image? `<img src="${p.image}">`:''}
      <div class="body">
        <div style="font-size:14px;margin-bottom:6px;">${esc(p.caption)}</div>
      </div>
    </div>`;
}
function openNewPost(){
  showModal(`
    <h3 style="margin-bottom:12px;">Yeni gönderi</h3>
    <input type="file" id="post-file" accept="image/*">
    <div class="field" style="margin-top:10px;"><label>Açıklama</label><textarea id="post-caption" rows="3" placeholder="Bugün ne yaptın?"></textarea></div>
    <button class="btn-primary" style="width:100%;" onclick="publishPost()">Paylaş</button>
  `);
}
async function publishPost(){
  const file = document.getElementById('post-file').files[0];
  const caption = document.getElementById('post-caption').value.trim();
  let image = null;
  if(file) image = await resizeFileToDataUrl(file, 800);
  await sb.from('posts').insert([{user_id: S.user.id, image, caption, likes:[], comments:[]}]);
  closeModal(); renderFeed(document.getElementById('content'));
}

  const isAdmin = S.user.email === 'eren@mail.com' || S.profile?.username === 'eren';

  c.innerHTML = `
    <div class="card">
      <div class="row" style="gap:10px;">
        <div class="avatar-edit">
          ${avatarHtml(S.profile,44)}
          <div class="pencil" onclick="document.getElementById('avatar-file').click()">✎</div>
          <input type="file" id="avatar-file" accept="image/*" style="display:none;" onchange="updateProfilePhoto(event)">
        </div>
        <div><div style="font-weight:600;">${esc(S.profile?.display_name)}</div><div class="muted">@${esc(S.profile?.username)}</div></div>
      </div>
    </div>
    ${isAdmin? `
    <div class="card" style="border-color:var(--accent);">
      <h3 style="margin-bottom:6px;">🛠️ Yönetici Paneli</h3>
      <p class="muted" style="font-size:12.5px;margin-bottom:10px;">Tüm kullanıcıları görüntüleyebilir ve verilerini yönetebilirsin.</p>
      <button class="btn-primary btn-sm" style="width:100%;" onclick="switchView('admin')">Kullanıcıları Yönet</button>
    </div>`:''}
    <button class="btn-ghost" style="width:100%;margin-top:10px;" onclick="doLogout()">Çıkış yap</button>
  `;
}

async function updateProfilePhoto(ev){
  const file = ev.target.files[0]; if(!file) return;
  const photo = await resizeFileToDataUrl(file, 220, 0.75);
  await sb.from('profiles').update({photo}).eq('id', S.user.id);
  S.profile.photo = photo;
  renderProfile(document.getElementById('content'));
}

// 🛠️ ADMIN PANELİ (Tüm kullanıcıları görme ve değiştirme)
async function renderAdmin(c){
  c.innerHTML = `<div class="empty">Yükleniyor…</div>`;
  const {data: users} = await sb.from('profiles').select('*');
  S.cache.adminUsers = users || [];

  c.innerHTML = `
    <button class="btn-ghost btn-sm" onclick="switchView('profile')">‹ Geri</button>
    <h3 style="margin:12px 0 4px;">🛠️ Yönetici - Tüm Kullanıcılar (${users?.length || 0})</h3>
    <p class="muted" style="font-size:11.5px;margin-bottom:12px;">Bu paneli yalnızca yönetici görebilir. İstediğin kullanıcının adını değiştirebilirsin.</p>
    ${(users||[]).map(u=>`
      <div class="card">
        <div class="row" style="gap:10px;align-items:flex-start;">
          ${avatarHtml(u,36)}
          <div style="flex:1;">
            <div style="font-weight:600;">${esc(u.display_name)}</div>
            <div class="muted" style="font-size:12px;">@${esc(u.username)}</div>
            <div class="muted" style="font-size:11px;">ID: ${u.id}</div>
          </div>
          <button class="btn-ghost btn-sm" onclick="openAdminEditUser('${u.id}')">Düzenle</button>
        </div>
      </div>
    `).join('')}
  `;
}

function openAdminEditUser(userId){
  const user = S.cache.adminUsers.find(u=>u.id===userId);
  if(!user) return;
  showModal(`
    <h3 style="margin-bottom:10px;">Kullanıcıyı Düzenle</h3>
    <div class="field"><label>Görünen Ad</label><input id="adm-display" value="${esc(user.display_name)}"></div>
    <div class="field"><label>Kullanıcı Adı</label><input id="adm-username" value="${esc(user.username)}"></div>
    <button class="btn-primary" style="width:100%;margin-top:6px;" onclick="saveAdminUser('${user.id}')">Değişiklikleri Kaydet</button>
  `);
}

async function saveAdminUser(userId){
  const display_name = document.getElementById('adm-display').value.trim();
  const username = document.getElementById('adm-username').value.trim().toLowerCase();
  if(!display_name || !username) return;

  await sb.from('profiles').update({display_name, username}).eq('id', userId);
  closeModal();
  renderAdmin(document.getElementById('content'));
}

// ================= MODAL =================
function showModal(html){
  const bg=document.createElement('div');
  bg.className='modal-bg'; bg.id='modal-bg';
  bg.innerHTML=`<div class="modal" style="position:relative;">${html}<div class="close-x" onclick="closeModal()">✕</div></div>`;
  bg.addEventListener('click', e=>{ if(e.target.id==='modal-bg') closeModal(); });
  document.body.appendChild(bg);
}
function closeModal(){ const m=document.getElementById('modal-bg'); if(m) m.remove(); renderView(); }

boot();
</script>
